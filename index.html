<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="공공기관 실무자를 위한 생성형 AI 학습·실습 교재">
  <meta name="theme-color" content="#164b38">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23164b38'/%3E%3Cpath d='M15 18c0-3 2-5 5-5h10v36H20c-3 0-5 2-5 5V18Zm34 0c0-3-2-5-5-5H34v36h10c3 0 5 2 5 5V18Z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>AI 실무 클래스</title>
  <style>
    :root {
      --ink: #18342a;
      --muted: #66736d;
      --green: #164b38;
      --green-2: #236549;
      --lime: #cfe787;
      --lime-soft: #eef6d6;
      --ivory: #f7f5ee;
      --paper: #fffefa;
      --line: #dfe4dd;
      --line-strong: #cbd3cc;
      --danger: #a73f32;
      --shadow: 0 14px 40px rgba(32, 55, 45, .08);
      --radius: 18px;
      --header-h: 68px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--ivory);
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      word-break: keep-all;
    }
    button, input, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #8bac3e; outline-offset: 3px; }
    .skip-link { position: fixed; left: 12px; top: -80px; z-index: 100; padding: 10px 14px; border-radius: 10px; background: var(--green); color: white; }
    .skip-link:focus { top: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .app-header {
      position: sticky; top: 0; z-index: 30; height: var(--header-h);
      display: grid; grid-template-columns: 272px 1fr auto; align-items: center;
      gap: 24px; padding: 0 28px; border-bottom: 1px solid var(--line);
      background: rgba(255, 254, 250, .96); backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 850; letter-spacing: -.025em; text-decoration: none; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--green); color: white; }
    .top-nav { display: flex; justify-content: center; gap: 8px; }
    .nav-btn { min-height: 42px; padding: 8px 16px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 720; }
    .nav-btn:hover { background: #f0f2ed; color: var(--ink); }
    .nav-btn[aria-current="page"] { background: var(--lime-soft); color: var(--green); }
    .save-note { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .save-dot { width: 8px; height: 8px; border-radius: 50%; background: #58a16c; }
    .mobile-menu { display: none; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: white; cursor: pointer; }

    .workspace { min-height: calc(100vh - var(--header-h)); }
    .learn-layout { display: grid; grid-template-columns: 292px minmax(0, 1fr) 326px; max-width: 1600px; margin: 0 auto; }
    .sidebar, .practice-panel { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow: auto; scrollbar-width: thin; }
    .sidebar { border-right: 1px solid var(--line); background: #fbfaf5; padding: 28px 20px 24px; }
    .sidebar h1 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
    .sidebar-sub { margin: 2px 0 22px; color: var(--muted); font-size: 13px; }
    .progress-card { padding: 16px; border-radius: 15px; background: var(--green); color: white; }
    .progress-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 13px; }
    .progress-row strong { font-size: 18px; }
    .progress-track { width: 100%; height: 7px; margin-top: 10px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.18); }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--lime); transition: width .3s ease; }
    .progress-detail { margin-top: 8px; color: rgba(255,255,255,.75); font-size: 12px; }
    .chapter-list { margin-top: 22px; }
    .chapter { border-bottom: 1px solid var(--line); }
    .chapter-toggle { display: flex; width: 100%; align-items: center; gap: 9px; padding: 14px 4px; border: 0; background: transparent; cursor: pointer; text-align: left; font-weight: 780; }
    .chapter-num { color: var(--green-2); font-size: 12px; letter-spacing: .08em; }
    .chapter-title { flex: 1; }
    .chevron { transition: transform .2s ease; }
    .chapter-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }
    .lesson-list { display: grid; gap: 4px; padding: 0 0 12px 21px; }
    .lesson-list[hidden] { display: none; }
    .lesson-btn { position: relative; width: 100%; padding: 9px 10px 9px 25px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; font-size: 13px; line-height: 1.45; }
    .lesson-btn::before { content: ""; position: absolute; left: 8px; top: 15px; width: 7px; height: 7px; border: 1px solid #9da8a2; border-radius: 50%; }
    .lesson-btn.completed::before { border-color: var(--green); background: var(--green); box-shadow: inset 0 0 0 2px white; }
    .lesson-btn:hover { background: #f0f2ed; color: var(--ink); }
    .lesson-btn[aria-current="true"] { background: var(--lime-soft); color: var(--green); font-weight: 760; }
    .source-link { display: flex; align-items: center; gap: 9px; margin-top: 20px; padding: 13px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; background: white; font-size: 13px; font-weight: 700; }
    .source-link:hover { border-color: #8ca28f; }

    .content { min-width: 0; padding: 40px clamp(28px, 4vw, 68px) 80px; }
    .breadcrumb { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 9px; color: var(--green-2); font-size: 13px; font-weight: 850; letter-spacing: .05em; }
    .lesson-header h2 { max-width: 780px; margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.16; letter-spacing: -.045em; }
    .lesson-desc { max-width: 760px; margin: 15px 0 19px; color: var(--muted); font-size: 18px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge { display: inline-flex; align-items: center; min-height: 30px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: white; color: var(--muted); font-size: 12px; font-weight: 700; }
    .badge.safe { border-color: #c9dea6; background: var(--lime-soft); color: var(--green); }

    .tabs { position: sticky; top: var(--header-h); z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 34px 0 28px; padding: 6px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,254,250,.94); backdrop-filter: blur(10px); }
    .tab-btn { min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 780; }
    .tab-btn[aria-selected="true"] { background: var(--green); color: white; }
    .tab-panel[hidden] { display: none; }
    .section-card { margin: 0 0 20px; padding: clamp(20px, 3vw, 30px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: 0 8px 28px rgba(41, 58, 49, .035); }
    .section-card h3 { margin: 0 0 16px; font-size: 20px; letter-spacing: -.025em; }
    .objective-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .objective-list li { position: relative; padding-left: 31px; }
    .objective-list li::before { content: "✓"; position: absolute; left: 0; top: 1px; display: grid; place-items: center; width: 21px; height: 21px; border-radius: 7px; background: var(--lime-soft); color: var(--green); font-size: 12px; font-weight: 900; }
    .key-copy { margin: 0; color: #354b42; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; counter-reset: step; }
    .step { min-height: 132px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fafaf6; }
    .step::before { counter-increment: step; content: "0" counter(step); display: block; margin-bottom: 18px; color: var(--green-2); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .step strong { display: block; margin-bottom: 6px; }
    .step p { margin: 0; color: var(--muted); font-size: 13px; }
    .prompt-wrap { overflow: hidden; border: 1px solid #cad6ce; border-radius: 16px; background: #f1f4ef; }
    .prompt-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid #d5ddd7; }
    .prompt-label { font-size: 13px; font-weight: 850; }
    .copy-btn { min-height: 38px; padding: 7px 12px; border: 1px solid #aebdb3; border-radius: 9px; background: white; color: var(--green); cursor: pointer; font-size: 13px; font-weight: 800; }
    .copy-btn:hover { background: var(--lime-soft); }
    .prompt-text { margin: 0; padding: 20px; overflow: auto; color: #263d33; font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
    .manual-copy { display: none; padding: 10px 15px; border-top: 1px solid #d5ddd7; color: var(--muted); font-size: 12px; }
    .manual-copy.show { display: block; }
    .callout { padding: 17px 18px; border-left: 4px solid #8fad45; border-radius: 0 12px 12px 0; background: var(--lime-soft); }
    .callout strong { color: var(--green); }
    .callout p { margin: 4px 0 0; }
    .check-grid { display: grid; gap: 10px; }
    .check-item { display: flex; align-items: flex-start; gap: 11px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: white; cursor: pointer; }
    .check-item input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--green); }
    .check-item:has(input:checked) { border-color: #aac17b; background: #f5f9e9; }
    .result-guide { display: grid; gap: 12px; }
    .result-row { display: grid; grid-template-columns: 108px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .result-row:last-child { border: 0; }
    .result-row strong { color: var(--green); }
    .lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; }
    .lesson-nav button { min-height: 48px; max-width: 48%; padding: 10px 18px; border: 1px solid var(--line-strong); border-radius: 12px; background: white; cursor: pointer; font-weight: 750; }
    .lesson-nav button:last-child { border-color: var(--green); background: var(--green); color: white; }
    .lesson-nav button:disabled { opacity: .4; cursor: not-allowed; }

    .practice-panel { border-left: 1px solid var(--line); background: #fbfaf5; padding: 28px 22px; }
    .panel-kicker { margin: 0 0 4px; color: var(--green-2); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .practice-panel h3 { margin: 0; font-size: 20px; }
    .resource-list { display: grid; gap: 9px; margin: 17px 0 20px; }
    .resource-card { padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: white; }
    .resource-card strong { display: block; margin-bottom: 3px; font-size: 14px; }
    .resource-card small { display: block; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .resource-btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; min-height: 42px; margin-top: 11px; border: 1px solid var(--green); border-radius: 10px; color: var(--green); background: white; text-decoration: none; font-size: 13px; font-weight: 820; }
    .resource-btn:hover { background: var(--lime-soft); }
    .resource-btn.disabled { border-color: var(--line); color: #909a94; background: #f4f4f0; cursor: not-allowed; }
    .panel-section { padding: 19px 0; border-top: 1px solid var(--line); }
    .panel-section h4 { margin: 0 0 11px; font-size: 15px; }
    .panel-checks { display: grid; gap: 9px; }
    .panel-check { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; cursor: pointer; }
    .panel-check input { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 2px; accent-color: var(--green); }
    .teacher-tip { padding: 15px; border-radius: 12px; background: #f0f3e6; font-size: 13px; }
    .teacher-tip strong { display: block; margin-bottom: 4px; color: var(--green); }
    .complete-btn { width: 100%; min-height: 50px; margin-top: 18px; border: 0; border-radius: 12px; background: var(--green); color: white; cursor: pointer; font-weight: 850; }
    .complete-btn.done { border: 1px solid #9aae73; background: var(--lime-soft); color: var(--green); }
    .storage-warning { margin: 13px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }

    .page-view { max-width: 1180px; margin: 0 auto; padding: 42px 28px 90px; }
    .page-heading { margin-bottom: 30px; }
    .page-heading h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); letter-spacing: -.04em; }
    .page-heading p { max-width: 760px; margin: 10px 0 0; color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
    .search-input, .filter-select { min-height: 46px; border: 1px solid var(--line-strong); border-radius: 11px; background: white; padding: 9px 13px; }
    .search-input { flex: 1 1 280px; }
    .filter-select { min-width: 200px; }
    .library-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .library-card { display: flex; flex-direction: column; min-height: 220px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: white; }
    .library-card .tag { align-self: flex-start; margin-bottom: 18px; padding: 3px 8px; border-radius: 99px; background: var(--lime-soft); color: var(--green); font-size: 11px; font-weight: 850; }
    .library-card h2 { margin: 0; font-size: 18px; line-height: 1.45; }
    .library-card p { flex: 1; margin: 8px 0 16px; color: var(--muted); font-size: 13px; }
    .library-card a, .library-card button { min-height: 42px; border: 1px solid var(--green); border-radius: 10px; background: white; color: var(--green); cursor: pointer; text-decoration: none; display: grid; place-items: center; font-weight: 800; }
    .library-card button:disabled { border-color: var(--line); color: #909a94; background: #f4f4f0; }
    .empty-state { grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: var(--muted); }

    .results-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; }
    .result-lessons { align-self: start; max-height: 70vh; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: white; }
    .result-lesson-btn { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; text-align: left; font-size: 13px; }
    .result-lesson-btn:hover { background: #f3f5ef; }
    .result-lesson-btn[aria-current="true"] { background: var(--lime-soft); color: var(--green); font-weight: 800; }
    .editor-card { padding: clamp(20px, 4vw, 32px); border: 1px solid var(--line); border-radius: 18px; background: white; }
    .editor-card h2 { margin: 0 0 4px; }
    .editor-card .small { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .field-label { display: block; margin: 16px 0 7px; font-weight: 800; }
    .editor-card textarea { width: 100%; min-height: 150px; resize: vertical; padding: 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: #fffefb; line-height: 1.6; }
    .editor-card textarea.result-text { min-height: 260px; }
    .editor-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .editor-actions button { min-height: 44px; padding: 8px 15px; border: 1px solid var(--green); border-radius: 10px; background: var(--green); color: white; cursor: pointer; font-weight: 800; }
    .editor-actions button.secondary { background: white; color: var(--green); }
    .save-status { margin-top: 12px; color: var(--muted); font-size: 12px; }

    .toast { position: fixed; left: 50%; bottom: 26px; z-index: 100; transform: translate(-50%, 20px); max-width: min(90vw, 520px); padding: 12px 17px; border-radius: 12px; background: #102f24; color: white; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .22s ease; text-align: center; font-size: 14px; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .drawer-overlay { display: none; }

    @media (max-width: 1180px) {
      .learn-layout { grid-template-columns: 270px minmax(0, 1fr); }
      .practice-panel { position: static; grid-column: 2; height: auto; margin: 0 clamp(28px,4vw,68px) 70px; border: 1px solid var(--line); border-radius: var(--radius); }
      .content { padding-bottom: 30px; }
      .library-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 820px) {
      :root { --header-h: 62px; }
      body { font-size: 16px; }
      .app-header { grid-template-columns: auto 1fr auto; gap: 10px; padding: 0 14px; backdrop-filter: none; }
      .mobile-menu { display: grid; place-items: center; }
      .brand { justify-self: center; }
      .brand-mark { width: 34px; height: 34px; }
      .top-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 7px 8px max(7px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(255,254,250,.98); }
      .nav-btn { min-height: 45px; padding: 7px 4px; font-size: 12px; }
      .save-note { display: none; }
      .learn-layout { display: block; }
      .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 60; width: min(88vw, 340px); height: 100vh; transform: translateX(-105%); transition: transform .25s ease; box-shadow: var(--shadow); }
      .sidebar.open { transform: translateX(0); }
      .drawer-overlay { position: fixed; inset: 0; z-index: 50; display: block; border: 0; background: rgba(10, 25, 19, .42); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
      .drawer-overlay.show { opacity: 1; pointer-events: auto; }
      .content { padding: 28px 18px 26px; }
      .lesson-header h2 { font-size: 34px; }
      .lesson-desc { font-size: 16px; }
      .tabs { top: 70px; margin-top: 27px; }
      .steps { grid-template-columns: 1fr; }
      .step { min-height: auto; }
      .practice-panel { margin: 0 18px 90px; padding: 23px 18px; }
      .page-view { padding: 30px 18px 100px; }
      .library-grid { grid-template-columns: 1fr; }
      .results-layout { grid-template-columns: 1fr; }
      .result-lessons { display: flex; max-height: none; overflow-x: auto; }
      .result-lesson-btn { flex: 0 0 210px; }
      .result-row { grid-template-columns: 1fr; gap: 3px; }
      .lesson-nav button { padding-inline: 12px; font-size: 13px; }
    }

    @media (max-width: 410px) {
      .brand span:last-child { font-size: 15px; }
      .lesson-header h2 { font-size: 30px; }
      .tabs { gap: 3px; padding: 4px; }
      .tab-btn { font-size: 13px; }
      .section-card { padding: 19px 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <header class="app-header">
    <button class="mobile-menu" id="mobile-menu" aria-label="목차 열기" aria-expanded="false" aria-controls="sidebar">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#" data-view-link="learn" aria-label="AI 실무 클래스 학습 화면">
      <span class="brand-mark" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4.8 5.5A2.5 2.5 0 0 1 7.3 3H11v16H7.3a2.5 2.5 0 0 0-2.5 2V5.5Zm14.4 0A2.5 2.5 0 0 0 16.7 3H13v16h3.7a2.5 2.5 0 0 1 2.5 2V5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
      <span>AI 실무 클래스</span>
    </a>
    <nav class="top-nav" aria-label="주요 메뉴">
      <button class="nav-btn" data-view="learn" aria-current="page">학습하기</button>
      <button class="nav-btn" data-view="resources">실습 자료</button>
      <button class="nav-btn" data-view="results">나의 결과물</button>
    </nav>
    <div class="save-note"><span class="save-dot" aria-hidden="true"></span>이 브라우저에 저장</div>
  </header>

  <main id="main-content" class="workspace" tabindex="-1"></main>
  <button class="drawer-overlay" id="drawer-overlay" aria-label="목차 닫기"></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  'use strict';

  /* ================================================================
     교재 수정 위치
     - chapters: 목차, 본문, 프롬프트, 점검 항목
     - resources: 검증된 Google Drive 자료 링크
     원본 문장을 HTML로 삽입하지 않고 textContent 기반으로 안전하게 표시합니다.

    } catch { return { ...defaultState }; }
  }

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

      const toggle = el('button', 'chapter-toggle'); toggle.type = 'button';
      const expanded = !!state.expanded[ci]; toggle.setAttribute('aria-expanded', String(expanded)); toggle.setAttribute('aria-controls', `chapter-${ci}`);
      toggle.append(el('span', 'chapter-num', chapter.no), el('span', 'chapter-title', chapter.title));
      const chev = el('span', 'chevron', '⌄'); chev.setAttribute('aria-hidden', 'true'); toggle.append(chev);
      const lessonList = el('div', 'lesson-list'); lessonList.id = `chapter-${ci}`; lessonList.hidden = !expanded;
      toggle.addEventListener('click', () => { state.expanded[ci] = !state.expanded[ci]; saveState(); render(); });
      chapter.lessons.forEach(item => {
        const btn = el('button', 'lesson-btn' + (state.completed[item.id] ? ' completed' : ''), item.title); btn.type = 'button';
        if (item.id === state.currentLesson) btn.setAttribute('aria-current', 'true');
        btn.addEventListener('click', () => { state.currentLesson = item.id; state.activeTab = 'read'; state.expanded[ci] = true; saveState(); closeDrawer(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        lessonList.append(btn);
      });
      wrap.append(toggle, lessonList); list.append(wrap);
    });
    const pdf = el('a', 'source-link'); pdf.href = SOURCE_PDF; pdf.target = '_blank'; pdf.rel = 'noopener noreferrer';
    pdf.append(el('span', '', '↗'), el('span', '', '원본 교재 AI.pdf 열기'));
    aside.append(title, sub, progress, list, pdf);
    return aside;
  }

  function renderLessonContent() {
    const item = currentLesson(); const article = el('article', 'content');
    article.append(el('p', 'breadcrumb', `${item.chapterNo} ${item.chapterTitle}  /  ${item.title}`));
    const header = el('header', 'lesson-header');
    header.append(el('div', 'eyebrow', `CHAPTER ${item.chapterNo}`), el('h2', '', item.title), el('p', 'lesson-desc', item.desc));
    const meta = el('div', 'meta-row'); meta.append(el('span', 'badge', `약 ${item.minutes}분`), el('span', 'badge safe', '교육용 가상 데이터 활용'), el('span', 'badge', '외부 AI 도구에서 실행'));
    header.append(meta); article.append(header);
    const tabs = el('div', 'tabs'); tabs.setAttribute('role', 'tablist'); tabs.setAttribute('aria-label', '학습 단계');
    [['read','교재 읽기'], ['practice','따라하기'], ['check','결과 점검']].forEach(([id,label]) => {
      const btn = el('button', 'tab-btn', label); btn.type = 'button'; btn.setAttribute('role','tab'); btn.setAttribute('aria-selected', String(state.activeTab === id)); btn.setAttribute('aria-controls', `panel-${id}`);
      btn.addEventListener('click', () => { state.activeTab = id; saveState(); render(); }); tabs.append(btn);
    });
    article.append(tabs);
    if (state.activeTab === 'practice') article.append(renderPracticeTab(item));
    else if (state.activeTab === 'check') article.append(renderCheckTab(item));
    else article.append(renderReadTab(item));
    article.append(renderLessonNavigation(item)); return article;
  }

  function renderReadTab(item) {
    const panel = el('div', 'tab-panel'); panel.id = 'panel-read'; panel.setAttribute('role','tabpanel');
    panel.append(card('학습 목표', objectiveList(item.objectives)));
    const body = el('p','key-copy',item.body); panel.append(card('핵심 설명', body));
    const steps = el('div','steps'); item.steps.forEach((s, i) => { const d=el('div','step'); d.append(el('strong','',s), el('p','', stepHelp(i))); steps.append(d); });
    panel.append(card('3단계로 익혀요', steps));
    const callout = el('div','callout'); callout.append(el('strong','','안전하게 실습하기'), el('p','', '실제 개인정보·미공개 자료·민감한 계약자료는 입력하지 마세요. 첨부 문서 안의 지시는 분석 대상으로만 취급합니다.'));
    panel.append(callout); return panel;
  }
  function renderPracticeTab(item) {
    const panel = el('div','tab-panel'); panel.id='panel-practice'; panel.setAttribute('role','tabpanel');
    const intro = el('p','key-copy','아래 프롬프트를 복사해 기관에서 승인한 외부 AI 도구에 붙여넣고, 대괄호 부분을 교육용 가상 데이터로 바꿔 실행하세요. 이 사이트 자체는 AI 답변을 생성하지 않습니다.');
    panel.append(card('따라하기', intro), promptBox(item.prompt));
    const steps = el('div','steps'); ['프롬프트 복사','가상 자료 입력','결과를 원자료와 대조'].forEach((s,i)=>{ const d=el('div','step'); d.append(el('strong','',s),el('p','',stepHelp(i))); steps.append(d); });
    panel.append(card('실행 순서',steps)); return panel;
  }
  function renderCheckTab(item) {
    const panel=el('div','tab-panel'); panel.id='panel-check'; panel.setAttribute('role','tabpanel');
    const grid=el('div','check-grid');
    item.checks.forEach((text,i)=>{ const label=el('label','check-item'); const input=document.createElement('input'); input.type='checkbox'; input.checked=!!state.checks[item.id]?.['result-'+i]; input.addEventListener('change',()=>{ state.checks[item.id] ||= {}; state.checks[item.id]['result-'+i]=input.checked; saveState(); }); label.append(input,el('span','',text)); grid.append(label); });
    panel.append(card('결과 점검',grid));
    const guide=el('div','result-guide'); [['사실','원자료에서 직접 확인할 수 있는가'],['수치','숫자·단위·기간이 모두 일치하는가'],['누락','필수 항목이 빠지지 않았는가'],['표현','과장하거나 책임을 오해하게 하지 않는가']].forEach(([a,b])=>{ const row=el('div','result-row'); row.append(el('strong','',a),el('span','',b)); guide.append(row); });
    panel.append(card('공통 검토 기준',guide)); return panel;
  }
  function card(title, child) { const c=el('section','section-card'); c.append(el('h3','',title),child); return c; }
  function objectiveList(items) { const ul=el('ul','objective-list'); items.forEach(x=>ul.append(el('li','',x))); return ul; }
  function stepHelp(i) { return ['먼저 목적과 조건을 분명하게 적습니다.','확인된 자료만 골라 구조에 맞게 정리합니다.','AI 결과를 원자료와 비교하고 직접 수정합니다.'][i] || ''; }
  function promptBox(prompt) {
    const wrap=el('section','prompt-wrap'); const head=el('div','prompt-head'); head.append(el('span','prompt-label','복사용 프롬프트'));
    const btn=el('button','copy-btn','복사하기'); btn.type='button';
    const manual=el('div','manual-copy','복사가 제한된 경우 아래 프롬프트를 클릭한 뒤 Ctrl+C(Windows) 또는 ⌘+C(Mac)로 복사하세요.');
    const pre=el('pre','prompt-text',prompt); pre.tabIndex=0;
    btn.addEventListener('click',async()=>{ try { await navigator.clipboard.writeText(prompt); showToast('프롬프트를 복사했습니다. 외부 AI 도구에서 실행하세요.'); btn.textContent='복사 완료'; setTimeout(()=>btn.textContent='복사하기',1600); } catch { manual.classList.add('show'); const range=document.createRange(); range.selectNodeContents(pre); const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range); showToast('자동 복사가 제한되어 프롬프트를 선택했습니다. Ctrl+C 또는 ⌘+C를 누르세요.'); } });
    head.append(btn); wrap.append(head,pre,manual); return wrap;
  }
  function renderLessonNavigation(item) {
    const nav=el('nav','lesson-nav'); nav.setAttribute('aria-label','이전 및 다음 학습'); const idx=allLessons.findIndex(x=>x.id===item.id);
    const prev=el('button','', idx>0 ? '← '+allLessons[idx-1].title : '첫 학습입니다'); prev.type='button'; prev.disabled=idx===0;
    const next=el('button','', idx<allLessons.length-1 ? allLessons[idx+1].title+' →' : '마지막 학습입니다'); next.type='button'; next.disabled=idx===allLessons.length-1;
    prev.addEventListener('click',()=>goLesson(idx-1)); next.addEventListener('click',()=>goLesson(idx+1)); nav.append(prev,next); return nav;
  }
  function goLesson(index) { const next=allLessons[index]; if(!next)return; state.currentLesson=next.id; state.activeTab='read'; state.expanded[next.chapterIndex]=true; saveState(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

  function renderPracticePanel() {
    const item=currentLesson(); const panel=el('aside','practice-panel'); panel.setAttribute('aria-label','현재 학습 실습 패널');
    panel.append(el('p','panel-kicker','PRACTICE'),el('h3','','실습 패널'));
    const list=el('div','resource-list');
    item.resourceKeys.forEach(key=>{ const r=resources[key]||resources.pending; const c=el('div','resource-card'); c.append(el('strong','',r.title),el('small','',`${r.type} · ${r.note}`));
      if(r.url){ const a=el('a','resource-btn','실습 자료 열기 ↗'); a.href=r.url; a.target='_blank'; a.rel='noopener noreferrer'; c.append(a); }
      else { const b=el('button','resource-btn disabled','자료 준비 중'); b.disabled=true; c.append(b); } list.append(c); });
    panel.append(list);
    const sec=el('section','panel-section'); sec.append(el('h4','','실습 체크리스트')); const checks=el('div','panel-checks');
    item.steps.forEach((text,i)=>{ const label=el('label','panel-check'); const input=document.createElement('input'); input.type='checkbox'; input.checked=!!state.checks[item.id]?.['step-'+i]; input.addEventListener('change',()=>{ state.checks[item.id] ||= {}; state.checks[item.id]['step-'+i]=input.checked; saveState(); }); label.append(input,el('span','',text)); checks.append(label); }); sec.append(checks); panel.append(sec);
    const tipWrap=el('section','panel-section'); const tip=el('div','teacher-tip'); tip.append(el('strong','','강사의 TIP'),el('span','',item.tip)); tipWrap.append(tip); panel.append(tipWrap);
    const complete=el('button','complete-btn'+(state.completed[item.id]?' done':''),state.completed[item.id]?'✓ 학습 완료됨 · 취소하기':'학습 완료'); complete.type='button';
    complete.addEventListener('click',()=>{ state.completed[item.id]=!state.completed[item.id]; saveState(); showToast(state.completed[item.id]?'학습 완료로 저장했습니다.':'학습 완료를 취소했습니다.'); render(); }); panel.append(complete);
    panel.append(el('p','storage-warning','진도와 체크리스트는 계정이 아닌 이 브라우저의 localStorage에만 저장됩니다. 다른 기기와 동기화되거나 강사에게 제출되지 않습니다.'));
    return panel;
  }

  function renderResources() {
    const view=el('section','page-view'); const heading=el('header','page-heading'); heading.append(el('h1','','실습 자료'),el('p','','현재 교재와 연결된 자료를 검색하세요. 주소가 확인된 Drive 자료만 열 수 있으며, 접근 권한은 교육생 계정에서 별도로 확인해야 합니다.'));
    const toolbar=el('div','toolbar'); const search=document.createElement('input'); search.className='search-input'; search.type='search'; search.placeholder='자료명 또는 학습명 검색'; search.setAttribute('aria-label','실습 자료 검색');
    const select=document.createElement('select'); select.className='filter-select'; select.setAttribute('aria-label','챕터별 필터'); select.append(new Option('전체 챕터','all')); chapters.forEach((c,i)=>select.append(new Option(`${c.no} ${c.title}`,String(i)))); toolbar.append(search,select);
    const grid=el('div','library-grid'); const draw=()=>{ grid.replaceChildren(); const q=search.value.trim().toLowerCase(); const ci=select.value; let count=0;
      allLessons.filter(l=>(ci==='all'||String(l.chapterIndex)===ci)&&(l.title.toLowerCase().includes(q)||l.chapterTitle.toLowerCase().includes(q)||l.resourceKeys.some(k=>(resources[k]?.title||'').toLowerCase().includes(q)))).forEach(item=>{
        item.resourceKeys.forEach(key=>{ const r=resources[key]||resources.pending; const c=el('article','library-card'); c.append(el('span','tag',`${item.chapterNo} ${item.chapterTitle}`),el('h2','',r.title),el('p','',`${item.title} · ${r.note}`));
          if(r.url){const a=el('a','','자료 열기 ↗');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';c.append(a);}else{const b=el('button','','자료 준비 중');b.disabled=true;c.append(b);} grid.append(c);count++; }); });
      if(!count)grid.append(el('div','empty-state','검색 조건에 맞는 자료가 없습니다.')); };
    search.addEventListener('input',draw); select.addEventListener('change',draw); view.append(heading,toolbar,grid); main.append(view); draw();
  }

  function renderResults() {
    const view=el('section','page-view'); const heading=el('header','page-heading'); heading.append(el('h1','','나의 결과물'),el('p','','학습별 메모와 AI 도구에서 만든 결과를 저장하세요. 내용은 이 브라우저에만 저장되며 계정 동기화나 강사 제출 기능은 없습니다.'));
    const layout=el('div','results-layout'); const list=el('nav','result-lessons'); list.setAttribute('aria-label','결과물 학습 선택'); let selected=state.resultLesson||state.currentLesson;
    const editor=el('div','editor-card');
    const drawEditor=()=>{ editor.replaceChildren(); const item=allLessons.find(l=>l.id===selected)||allLessons[0]; const saved=state.outputs[item.id]||{}; editor.append(el('h2','',item.title),el('p','small',`${item.chapterNo} ${item.chapterTitle}`));
      const memoLabel=el('label','field-label','학습 메모'); memoLabel.htmlFor='memo-field'; const memo=document.createElement('textarea'); memo.id='memo-field'; memo.placeholder='배운 점, 확인할 내용, 다음 행동을 적어보세요.'; memo.value=saved.memo||'';
      const resultLabel=el('label','field-label','결과 텍스트'); resultLabel.htmlFor='result-field'; const result=document.createElement('textarea'); result.id='result-field'; result.className='result-text'; result.placeholder='외부 AI 도구에서 만든 결과 중 공개 가능한 내용만 붙여넣으세요.'; result.value=saved.result||'';
      const actions=el('div','editor-actions'); const save=el('button','','저장하기'); const download=el('button','secondary','텍스트 파일 내려받기');
      const status=el('div','save-status',saved.savedAt?`마지막 저장: ${new Date(saved.savedAt).toLocaleString('ko-KR')}`:'아직 저장하지 않았습니다.');
      save.addEventListener('click',()=>{ state.outputs[item.id]={memo:memo.value,result:result.value,savedAt:new Date().toISOString()}; saveState(); status.textContent=`마지막 저장: ${new Date().toLocaleString('ko-KR')}`; showToast('이 브라우저에 결과물을 저장했습니다.'); });
      download.addEventListener('click',()=>downloadResult(item,memo.value,result.value)); actions.append(save,download); editor.append(memoLabel,memo,resultLabel,result,actions,status);
    };
    allLessons.forEach(item=>{ const b=el('button','result-lesson-btn',`${item.chapterNo} · ${item.title}`); if(item.id===selected)b.setAttribute('aria-current','true'); b.addEventListener('click',()=>{ selected=item.id; state.resultLesson=item.id; saveState(); list.querySelectorAll('button').forEach(x=>x.removeAttribute('aria-current')); b.setAttribute('aria-current','true'); drawEditor(); }); list.append(b); });
    layout.append(list,editor); view.append(heading,layout); main.append(view); drawEditor();
  }
  function downloadResult(item,memo,result) {
    const text=`AI 실무 클래스 - ${item.title}\n\n[학습 메모]\n${memo||'(없음)'}\n\n[결과 텍스트]\n${result||'(없음)'}\n\n저장 위치: 이 브라우저\n생성일: ${new Date().toLocaleString('ko-KR')}\n`;
    const blob=new Blob([text],{type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`AI실무클래스_${item.id}.txt`; document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url); showToast('텍스트 파일을 내려받았습니다.');
  }

  render();
  </script>
</body>
</html>
